<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASSCOGH-MODOO | Learn • Prepare • Choose • Grow</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--muted:#65738b;--brand:#1261ff;--good:#087443;--border:#e4e9f2}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:5;padding:12px}
.brand{font-weight:900;font-size:20px}.tag{color:var(--muted);font-size:12px}
nav{display:flex;gap:8px;overflow:auto;margin-top:10px}button,.btn{border:0;border-radius:12px;padding:11px 14px;background:#edf2ff;color:#1241a0;font-weight:700;cursor:pointer;white-space:nowrap}
button.primary{background:var(--brand);color:white}.wrap{max-width:1100px;margin:auto;padding:18px}
.hero{background:linear-gradient(135deg,#102a66,#1261ff);color:#fff;border-radius:24px;padding:24px;margin-bottom:16px}.hero h1{font-size:clamp(28px,7vw,48px);margin:0 0 8px}.hero p{opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 5px 18px #102a6610}.card h3{margin:0 0 7px}.muted{color:var(--muted)}.pill{display:inline-block;background:#edf2ff;padding:5px 9px;border-radius:999px;font-size:12px;margin:3px}
input,select{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;margin:5px 0 10px;background:white}.row{display:flex;gap:8px;flex-wrap:wrap}.section{margin:18px 0}.hidden{display:none}.ad{border:1px dashed #aab4c7;padding:13px;border-radius:14px;text-align:center;background:#fff8df}.steps{counter-reset:s}.step{padding:10px 0;border-bottom:1px solid var(--border)}.step:before{counter-increment:s;content:counter(s) ". ";font-weight:900}.small{font-size:13px}footer{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><div class="brand">PASSCOGH-MODOO</div><div class="tag">Learn • Prepare • Choose • Grow</div>
<nav id="nav"></nav></div></header>
<main class="wrap"><div id="app"></div></main>
<footer>Created for Ghanaian learners • Verify official curriculum, admissions and accreditation before making decisions.</footer>
<script>
let DATA=null, INST=null, state={level:"home",subject:null,topic:null,minutes:0,owner:false};
const navItems=[["home","Home"],["pre-shs","Pre-SHS"],["jhs","JHS"],["shs","SHS"],["pre-uni","Pre-University"],["tertiary","University & Colleges"],["learn","Learning Materials"]];
document.getElementById("nav").innerHTML=navItems.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("");
async function load(){[DATA,INST]=await Promise.all([fetch("/api/curriculum").then(r=>r.json()),fetch("/api/institutions").then(r=>r.json())]);go("home")}
function go(level){state={...state,level,subject:null,topic:null};render()}
function render(){
const a=document.getElementById("app");
if(!DATA){a.innerHTML="<div class=card>Loading PASSCOGH-MODOO…</div>";return}
if(state.level==="home")return home(a);
if(state.level==="pre-shs")return preShs(a);
if(state.level==="jhs")return subjectChooser(a,"JHS");
if(state.level==="shs")return pathwayChooser(a);
if(state.level==="pre-uni")return preUni(a);
if(state.level==="tertiary")return tertiary(a);
if(state.level==="learn")return materials(a);
if(state.subject&&!state.topic)return topicChooser(a,state.subject);
if(state.topic)return lesson(a,state.subject,state.topic);
}
function home(a){a.innerHTML=`<section class=hero><h1>Learn with confidence.</h1><p>A Ghana-focused learning platform for JHS, SHS, pre-SHS and pre-university learners.</p><div class=row><button class=primary onclick="go('pre-shs')">I’m preparing for SHS</button><button onclick="go('shs')">I’m in SHS</button><button onclick="go('pre-uni')">I’m preparing for tertiary</button></div></section>
<div class=grid>${[
["📘 Pre-SHS","Bridge JHS to SHS with readiness, pathway and study guidance.","pre-shs"],
["📚 JHS 1–3","Study the CCP subject structure with simple explanations and practice.","jhs"],
["🎓 SHS 1–3","Explore pathways, subjects, lessons, worked examples and exam preparation.","shs"],
["🚀 Pre-University","Use your subject/result profile to explore possible programmes and institutions.","pre-uni"],
["🏫 University & Colleges","Compare institutions and verify accreditation before applying.","tertiary"],
["🧠 PASSCO Method","Every problem: Given → Required → Principle → Substitute → Work → Unit → Check.","learn"]
].map(c=>`<div class=card><h3>${c[0]}</h3><p class=muted>${c[1]}</p><button onclick="go('${c[2]}')">Open</button></div>`).join("")}</div>
<div class=section><div class=ad id=adbox>Study safely. Ad break appears after 15 minutes of active study.</div></div>`}
function preShs(a){let m=DATA.pre_shs.modules;a.innerHTML=`<div class=card><h2>🟢 Pre-SHS / SHS Readiness</h2><p>For JHS graduates preparing to enter SHS.</p><div class=grid>${m.map(x=>`<div class=card><b>${x}</b><p class=muted>Build the knowledge and habits needed before SHS begins.</p><button onclick="alert('Module ready: ${x}')">Start</button></div>`).join("")}</div></div>`}
function subjectChooser(a,level){let arr=level==="JHS"?DATA.jhs.subjects:DATA.shs.subjects;a.innerHTML=`<div class=card><h2>${level} Subjects</h2><input placeholder="Search subject…" oninput="filterSubjects(this,'${level}')"><div id=subs class=grid>${arr.map(s=>`<div class=card sub><h3>${s}</h3><button onclick="openSubject('${s}')">Open subject</button></div>`).join("")}</div></div>`}
function filterSubjects(inp,level){let q=inp.value.toLowerCase();document.querySelectorAll(".sub").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"block":"none")}
function openSubject(s){state.subject=s;state.topic=null;render()}
function pathwayChooser(a){a.innerHTML=`<div class=card><h2>🔵 SHS Pathways</h2><p class=muted>NaCCA says subject combinations depend on the capacity and focus of the individual school.</p><div class=grid>${DATA.shs.pathways.map(p=>`<div class=card><h3>${p.name}</h3>${p.subjects.map(s=>`<span class=pill>${s}</span>`).join("")}<br><button onclick="openSubject('${p.subjects[0]}')">Explore</button></div>`).join("")}</div></div>`}
function topicChooser(a,s){let d=DATA.subjects[s];a.innerHTML=`<div class=card><button onclick="go('shs')">← Back</button><h2>${s}</h2><p><b>Memory trick:</b> ${d.default_mnemonic}</p><div class=grid>${d.topics.map((t,i)=>`<div class=card><h3>${i+1}. ${t.title}</h3><button onclick="openTopic(${i})">Learn this topic</button></div>`).join("")}</div></div>`}
function openTopic(i){state.topic=DATA.subjects[state.subject].topics[i];render()}
function lesson(a,s,t){a.innerHTML=`<div class=card><button onclick="state.topic=null;render()">← Topics</button><h2>${s}: ${t.title}</h2><div class=steps>
<div class=step><b>Learning objective</b><br>Understand the key ideas, apply them and explain them in your own words.</div>
<div class=step><b>Simple explanation</b><br>${t.title} is taught from first principles, with familiar examples.</div>
<div class=step><b>Memory trick</b><br>${DATA.subjects[s].default_mnemonic}</div>
<div class=step><b>Diagram / visual</b><br>Use a clearly labelled diagram where the concept benefits from one. Draw labels large enough to copy into notes.</div>
<div class=step><b>Worked example</b><br>Identify what is given and what is required before choosing a rule or formula.</div>
<div class=step><b>Step-by-step working</b><br><b>GIVEN → REQUIRED → PRINCIPLE/FORMULA → WHY → SUBSTITUTE → CALCULATE → UNIT → ANSWER → CHECK.</b></div>
<div class=step><b>Common mistakes</b><br>Wrong units, skipping reasoning, copying a formula without understanding, and failing to check the final answer.</div>
<div class=step><b>Practice</b><br>Try an easy question, then a standard question, then an exam-style application.</div>
<div class=step><b>Exam checkpoint</b><br>Explain the concept without looking at the note, then solve one timed question.</div>
</div></div>`}
function preUni(a){a.innerHTML=`<div class=card><h2>🟠 Pre-University / Pre-College</h2><p>Enter the subjects you studied and your results to explore possible pathways. This is guidance—not a guarantee of admission.</p><label>Subjects (comma separated)</label><input id=us placeholder="e.g. Mathematics, Physics, Chemistry, English Language"><label>Grades (optional)</label><input id=grades placeholder="e.g. Mathematics:A1, Physics:B3, Chemistry:B2"><button class=primary onclick="match()">Find possible programmes</button><div id=matchout class=section></div></div>`}
function match(){let q=document.getElementById("us").value.toLowerCase();let out=INST.course_rules.filter(r=>r.keywords.filter(k=>q.includes(k)).length>=2).flatMap(r=>r.programmes);document.getElementById("matchout").innerHTML=`<h3>Possible directions</h3>${[...new Set(out)].map(x=>`<span class=pill>${x}</span>`).join("")||"<p>Enter more relevant subjects. Always confirm the current entry requirements of the programme.</p>"}`}
function tertiary(a){a.innerHTML=`<div class=card><h2>🏫 Universities & Colleges</h2><p class=muted>GTEC recommends verifying accreditation directly before applying.</p><input placeholder="Search institution…" oninput="filterInst(this)"><div id=insts class=grid>${INST.institutions.map(x=>`<div class=card inst><h3>${x.name}</h3><p>${x.type} • ${x.location}</p><a class=btn href="${x.url}" target=_blank>Official site</a><a class=btn href="https://gtec.edu.gh/accreditation/" target=_blank>Verify accreditation</a></div>`).join("")}</div></div>`}
function filterInst(i){let q=i.value.toLowerCase();document.querySelectorAll(".inst").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"block":"none")}
function materials(a){a.innerHTML=`<div class=card><h2>📚 Learning Materials</h2><p>Read supported materials online. Paid downloads must be processed by the server after payment verification.</p><div class=grid><div class=card><h3>Free reading</h3><p>Open learning notes inside PASSCOGH-MODOO.</p></div><div class=card><h3>Paid download</h3><p>Payment verification happens on the backend before a protected download is issued.</p></div><div class=card><h3>Copyright protection</h3><p>Use access controls, watermarks and server-side delivery to discourage unauthorised redistribution. No website can guarantee that a determined user cannot copy content.</p></div></div></div>`}
load();
</script></body></html>
